name: Build Turnip AYN Thor

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git meson ninja-build unzip curl flex bison zip glslang-tools python3 python3-mako pkg-config clang lld

      - name: Build Turnip driver
        run: |
          chmod +x build_turnip.sh
          ./build_turnip.sh

      - name: Upload compiled driver
        uses: actions/upload-artifact@v4
        with:
          name: Turnip_AYN_Thor_A740
          path: turnip_workdir/*.zip
